name: Conductor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    name: Python ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      # Full style rules still have a backlog; fail on syntax / undefined names.
      run: ruff check conductor/ --select E9,F63,F7,F82

    - name: Test imports
      run: |
        python -c "from conductor import Agent, Tool, Workflow, Swarm, Memory; print('Conductor imports OK')"

    - name: Run tests
      run: pytest tests/ -v

