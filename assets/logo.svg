<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Orchestration Ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="4 6" opacity="0.4" />
  
  <!-- Outer Node Tracks -->
  <path d="M 50 100 A 50 50 0 0 1 150 100" fill="none" stroke="url(#grad-accent)" stroke-width="3" opacity="0.7" />
  <path d="M 50 100 A 50 50 0 0 0 150 100" fill="none" stroke="url(#grad-primary)" stroke-width="3" opacity="0.7" />

  <!-- Orchestration Waves / Connection Vectors -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="url(#grad-primary)" stroke-width="3" stroke-linecap="round" />
  <line x1="45" y1="75" x2="155" y2="125" stroke="url(#grad-primary)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="45" y1="125" x2="155" y2="75" stroke="url(#grad-primary)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Peripheral Agent Nodes -->
  <circle cx="100" cy="40" r="10" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="100" cy="40" r="6" fill="#FFFFFF" />

  <circle cx="155" cy="75" r="9" fill="#818CF8" />
  <circle cx="155" cy="75" r="5" fill="#FFFFFF" />

  <circle cx="155" cy="125" r="9" fill="#8B5CF6" />
  <circle cx="155" cy="125" r="5" fill="#FFFFFF" />

  <circle cx="100" cy="160" r="10" fill="#EC4899" filter="url(#glow)" />
  <circle cx="100" cy="160" r="6" fill="#FFFFFF" />

  <circle cx="45" cy="125" r="9" fill="#8B5CF6" />
  <circle cx="45" cy="125" r="5" fill="#FFFFFF" />

  <circle cx="45" cy="75" r="9" fill="#818CF8" />
  <circle cx="45" cy="75" r="5" fill="#FFFFFF" />

  <!-- Central Conductor Core -->
  <circle cx="100" cy="100" r="24" fill="url(#grad-primary)" filter="url(#glow)" />
  <circle cx="100" cy="100" r="14" fill="#0F172A" />
  <circle cx="100" cy="100" r="7" fill="#FFFFFF" />
</svg>
